<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hd">
    <img class="hd-logo" src="icons/app-icon.svg" alt="" aria-hidden="true">
    <h1 class="hd-title">YDL GUI Helper</h1>
    <select id="language" class="language" aria-label="Language">
      <option value="en">English</option>
      <option value="zh_CN">中文</option>
    </select>
  </header>

  <div class="mode-tabs">
    <button id="mode-standard-btn" class="mode-tab active" type="button" data-i18n="modeStandard">标准模式</button>
    <button id="mode-batch-btn" class="mode-tab" type="button" data-i18n="modeBatch">批量模式</button>
  </div>

  <main class="body">
    <!-- 标准模式面板：专注于当前活动标签页 -->
    <section id="panel-standard" class="mode-panel">
      <div class="active-tab-card">
        <div class="active-tab-header">
          <img id="tab-icon" class="active-tab-icon" src="icons/icon16.png" alt="" aria-hidden="true">
          <div id="tab-title" class="active-tab-title" data-i18n="popupChecking">正在获取当前标签页...</div>
        </div>
        <div id="status" class="pill pill-muted">
          <span class="dot"></span>
          <span id="status-text" data-i18n="popupChecking">正在识别页面…</span>
        </div>
      </div>
      <div class="url-input-wrap">
        <input
          id="url-input"
          type="text"
          class="url-input"
          placeholder="https://..."
          spellcheck="false"
          autocomplete="off"
        >
      </div>
    </section>

    <!-- 批量模式面板：当前窗口标签页多选 -->
    <section id="panel-batch" class="mode-panel" hidden>
      <div class="batch-bar">
        <span class="batch-title" data-i18n="popupBatchTabsTitle">当前窗口可用标签页</span>
        <div class="batch-actions">
          <button id="batch-select-all" class="text-btn" type="button" data-i18n="popupSelectAll">全选</button>
          <span class="sep">/</span>
          <button id="batch-deselect-all" class="text-btn" type="button" data-i18n="popupDeselectAll">全不选</button>
        </div>
      </div>
      <div id="batch-list" class="batch-list"></div>
      <div id="batch-empty" class="batch-empty" hidden data-i18n="popupNoValidTabs">未找到有效的网页标签</div>
    </section>

    <!-- 通用 Cookie 发送选项 -->
    <div class="row" id="cookie-row">
      <div class="row-text">
        <div class="row-label" data-i18n="popupSendCookies">同时发送 Cookie</div>
        <div class="row-hint" data-i18n="popupSendCookiesHint">下载会员/登录后才能观看的视频时需要</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="send-cookies" checked>
        <span class="track"></span>
      </label>
    </div>

    <!-- 发送主按钮 -->
    <button class="btn" id="send-btn">
      <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
      <span id="btn-text" data-i18n="popupSendBtn">发送到 YDL GUI</span>
    </button>

    <!-- 故障降级提示 -->
    <div id="fallback" class="fallback" hidden>
      <div class="fallback-title" data-i18n="popupAppNotFoundTitle">应用没有打开？</div>
      <div class="fallback-desc" data-i18n="popupAppNotFoundDesc">如果没有任何反应，请确认 YDL GUI 已安装并保持运行。</div>
      <a id="fallback-link"
         class="fallback-link"
         href="https://github.com/imsyy/yt-dlp-gui/releases/latest"
         target="_blank"
         rel="noopener"
         data-i18n="popupDownload">下载 YDL GUI</a>
    </div>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
